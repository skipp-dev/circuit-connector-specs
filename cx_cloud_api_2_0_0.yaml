      schema:
        type: string
        example: '234'
    hwInstanceId_param:
      name: hwInstanceId
      in: query
      description: Unique identifier of the physical hardware
      schema:
        type: string
        example: 'SERIAL1,PID1,NA,NA,SERIAL2,PID2,NA'
    hwType_param:
      name: hwType
