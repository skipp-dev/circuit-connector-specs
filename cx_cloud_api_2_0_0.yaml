      schema:
        type: string
        example: '2024-11-11'
    eoNewServiceAttachmentDate_param:
      name: eoNewServiceAttachmentDate
      in: query
      description: Last date to order a new service and support contract or add the equipment and software to an existing service-and-support contract
      schema:
        type: string
        example: '2024-11-11'
    eoRoutineFailureAnalysisDate_param:
      name: eoRoutineFailureAnalysisDate
      in: query
      description: Last possible date a routine failure analysis may be performed to determine the cause of hardware product failure or defect
      schema:
        type: string
        example: '2024-11-11'
    eoSaleDate_param:
      name: eoSaleDate
      in: query
      description: Last date to order the product through Cisco point-of-sale mechanisms. The product is no longer for sale after this date.
      schema:
        type: string
        example: '2024-11-11'
    eoServiceContractRenewalDate_param:
      name: eoServiceContractRenewalDate
      in: query
      description: Last date to extend or renew a service contract for the product
      schema:
        type: string
        example: '2024-11-11'
    eoSwMaintenanceReleasesDate_param:
      name: eoSwMaintenanceReleasesDate
      in: query
      description: Last date that Cisco engineering may release any final software maintenance releases or bug fixes. After this date, Cisco engineering will no longer develop, repair, maintain, or test the product software.
      schema:
        type: string
        example: '2024-11-11'
    eoVulnerabilitySecuritySupport_param:
      name: eoVulnerabilitySecuritySupport
      in: query
      description: Last date that Cisco engineering may release a planned maintenance release or scheduled software remedy for a security vulnerability issue.
      schema:
        type: string
        example: '2024-11-11'
    hostname_param:
      name: hostname
      in: query
