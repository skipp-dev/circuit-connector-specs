      schema:
        type: string
        example: '192.168.1.1'
    isManagedNe_param:
      name: isManagedNe
      in: query
      description: Indicates whether the collector or data source directly manages the device.
      schema:
        type: integer
        example: 1
    lastDateOfSupport_param:
      name: lastDateOfSupport
      in: query
      description: Last date to receive applicable service and support for the product as entitled by active service contracts or by warranty terms and conditions. After this date, all support services for the product will be unavailable and the product becomes obsolete.
      schema:
        type: string
        example: '2024-11-11'
    lastShipDate_param:
      name: lastShipDate
      in: query
      description: Last possible ship date that can be requested of Cisco and its contract manufacturers. Actual ship date depends on lead time.
      schema:
        type: string
        example: '2024-11-11'
    managedNeInstanceId_param:
      name: managedNeInstanceId
      in: query
      description: Identifier for the managed network element. For single chassis devices, the managedNeInstanceId and neInstanceId are same.  For multi-chassis devices, the managedNeInstanceId is the neInstanceId of the primary chassis and all the neInstanceIds will be share the same managedNeInstanceId.
      schema:
        type: string
        example: 'NA,SERIAL,PID,NA'
    neInstanceId_param:
      name: neInstanceId
      in: query
      description: Identifier for a network element.  A network element is a manageable logical entity uniting one or more physical devices and allows distributed devices to be managed in a unified way using one management system.
      schema:
        type: string
        example: 'NA,SERIAL,PID,NA'
    nextHwEolMilestone_param:
      name: nextHwEolMilestone
      in: query
      description: Next hardware end-of-life milestone that is coming up. If the device is already LDoS, it will not have a next milestone.
      schema:
        type: string
        example: 'END_OF_SALE'
    nextSwEolMilestone_param:
      name: nextSwEolMilestone
      in: query
      description: Next software end-of-life milestone that is coming up. If the device is already LDoS, it will not have a next milestone.
      schema:
        type: string
        example: 'END_OF_SALE'
    productId_param:
      name: productId
      in: query
      description: The alphanumeric unique identifier of a Cisco Product. The id is used by customers to order Cisco products.
      schema:
        type: string
        example: 'ISR4331/K9'
    productFamily_param:
      name: productFamily
      in: query
      description: Grouping of similar Cisco products.
      schema:
        type: string
        example: 'Cisco Catalyst 9500 Series Switches'
    productSubtype_param:
      name: productSubtype
      in: query
      description: Further classification for hardware within a Product Type.
      schema:
        type: string
        example: 'Blade Server'
    productType_param:
      name: productType
      in: query
      description: Broad classification of Cisco product that categorizes its function.
      schema:
        type: string
        example: 'Switches'
    securityAdvisoryInstanceId_param:
