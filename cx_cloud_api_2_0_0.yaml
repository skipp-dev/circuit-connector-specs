openapi: 3.0.1
info:
  title: CX Cloud API
  version: 2.0.0
  description: APIs to access CX Cloud data
  contact:
    name: CX Cloud Community
    url: https://community.cisco.com/t5/cx-cloud/bd-p/CX-Cloud-Discussions
  license:
    name: Cisco API License
    url: https://developer.cisco.com/site/license/cisco-api-license/
  termsOfService: https://www.cisco.com/c/dam/en_us/about/doing_business/legal/seula/cx-cloud-seula.pdf
servers:
  - url: https://apix.cisco.com/cs/api/v2
    description: Cisco API Console
security:
  - Oauth2:
      - "apis:read"

tags:
  - name: customer
    description: API operations to get customer details from entitled CX Cloud accounts
  - name: inventory
    description: API operations to get inventory details from entitled CX Cloud accounts
  - name: contract
    description: API operations to get contract details from entitled CX Cloud accounts
  - name: productAlert
    description: API operations to get alerts details from entitled CX Cloud accounts

paths:
  /contracts/contract-details:
    get:
      summary: List Contracts
      operationId: getContractDetails
      description: Returns the Cisco service contracts connected to a CX Cloud account.
      tags: [contract]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/contractNumber_param'
        - $ref: '#/components/parameters/contractStartDate_param'
        - $ref: '#/components/parameters/contractEndDate_param'
        - $ref: '#/components/parameters/contractStatus_param'
        - $ref: '#/components/parameters/serviceLevel_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/ContractDetailsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /contracts/coverage:
    get:
      summary: List Covered Assets
      operationId: getCoverage
      description: Returns assets in a CX Cloud account that are covered by a Cisco service contract.
      tags: [contract]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/contractNumber_param'
        - $ref: '#/components/parameters/contractStatus_param'
        - $ref: '#/components/parameters/coverageStartDate_param'
        - $ref: '#/components/parameters/coverageEndDate_param'
        - $ref: '#/components/parameters/coverageStatus_param'
        - $ref: '#/components/parameters/serialNumber_param'
        - $ref: '#/components/parameters/serviceLevel_param'
        - $ref: '#/components/parameters/productId_param'
        - $ref: '#/components/parameters/serviceLineStatus_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/CoverageResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /contracts/not-covered:
    get:
      summary: List Uncovered Assets
      operationId: getNotCovered
      description: Returns assets in a CX Cloud account that are not covered by a Cisco service contract.
      tags: [contract]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/serialNumber_param'
        - $ref: '#/components/parameters/productId_param'
        - $ref: '#/components/parameters/contractInstanceNumber_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/NotCoveredResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /inventory/hardware:
    get:
      summary: List Hardware
      operationId: getHardware
      description: Returns asset details (Chassis and Components) in a CX Cloud account.
      tags: [inventory]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/hwType_param'
        - $ref: '#/components/parameters/hwInstanceId_param'
        - $ref: '#/components/parameters/productSubtype_param'
        - $ref: '#/components/parameters/productType_param'
        - $ref: '#/components/parameters/productFamily_param'
        - $ref: '#/components/parameters/productId_param'
        - $ref: '#/components/parameters/serialNumber_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/HardwareResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /inventory/network-elements:
    get:
      summary: List Network Elements
      operationId: getNetworkElements
      description: Returns asset details (Chassis) in a CX Cloud account.
      tags: [inventory]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/isManagedNe_param'
        - $ref: '#/components/parameters/ipAddress_param'
        - $ref: '#/components/parameters/hostname_param'
        - $ref: '#/components/parameters/swType_param'
        - $ref: '#/components/parameters/swVersion_param'
        - $ref: '#/components/parameters/productFamily_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/NetworkElementsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /customer-info/customer-details:
    get:
      summary: List Customer Accounts
      operationId: getCustomerDetails
      description: Returns CX Cloud accounts the user has permission to query.
      tags: [customer]
      parameters:
        - $ref: '#/components/parameters/customerId_param_optional'
        - $ref: '#/components/parameters/customerName_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        "200": { $ref: '#/components/responses/CustomerDetailsResponse' }
        "400": { $ref: '#/components/responses/BadRequestResponse' }
        "401": { $ref: '#/components/responses/UnauthorizedResponse' }
        "403": { $ref: '#/components/responses/ForbiddenResponse' }
        "404": { $ref: '#/components/responses/NotFoundResponse' }
        "500": { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/field-notices:
    get:
      summary: List Field Notices
      operationId: getFieldNotices
      description: Returns details of active Field Notice vulnerabilities on the assets in a CX Cloud account.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/bulletinNumber_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/hwInstanceId_param'
        - $ref: '#/components/parameters/vulnerabilityStatus_param'
        - $ref: '#/components/parameters/hostname_param'
        - $ref: '#/components/parameters/swType_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/FieldNoticesResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/field-notice-bulletins:
    get:
      summary: List Field Notice Bulletins
      operationId: getFieldNoticeBulletins
      description: Returns Field Notice bulletin data for the bulletins in the field-notices API.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/bulletinNumber_param'
        - $ref: '#/components/parameters/bulletinFirstPublished_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/FieldNoticeBulletinsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/hardware-eol:
    get:
      summary: List Hardware EOL
      operationId: getHardwareEOL
      description: Returns the Hardware End of Life details of hardware assets in a CX Cloud account.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/hwInstanceId_param'
        - $ref: '#/components/parameters/hostname_param'
        - $ref: '#/components/parameters/hwType_param'
        - $ref: '#/components/parameters/currentHwEolMilestone_param'
        - $ref: '#/components/parameters/nextHwEolMilestone_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/HardwareEolResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/hardware-eol-bulletins:
    get:
      summary: List Hardware EOL Bulletins
      operationId: getHardwareEOLBulletins
      description: Returns End of Life bulletin data for the bulletins in the hardware-eol API.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/bulletinNumber_param'
        - $ref: '#/components/parameters/bulletinProductId_param'
        - $ref: '#/components/parameters/bulletinTitle_param'
        - $ref: '#/components/parameters/eoLifeAnnouncementDate_param'
        - $ref: '#/components/parameters/eoSaleDate_param'
        - $ref: '#/components/parameters/hwEolInstanceId_param'
        - $ref: '#/components/parameters/lastShipDate_param'
        - $ref: '#/components/parameters/eoSwMaintenanceReleasesDate_param'
        - $ref: '#/components/parameters/eoRoutineFailureAnalysisDate_param'
        - $ref: '#/components/parameters/eoNewServiceAttachmentDate_param'
        - $ref: '#/components/parameters/eoServiceContractRenewalDate_param'
        - $ref: '#/components/parameters/lastDateOfSupport_param'
        - $ref: '#/components/parameters/eoVulnerabilitySecuritySupport_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/HardwareEolBulletinsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/security-advisories:
    get:
      summary: List Security Advisories
      operationId: getSecurityAdvisories
      description: Returns the active Security Advisory vulnerabilities on the assets in a CX Cloud account.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/hwInstanceId_param'
        - $ref: '#/components/parameters/vulnerabilityStatus_param'
        - $ref: '#/components/parameters/hostname_param'
        - $ref: '#/components/parameters/swType_param'
        - $ref: '#/components/parameters/securityAdvisoryInstanceId_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/SecurityAdvisoriesResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/security-advisory-bulletins:
    get:
      summary: List Security Advisory Bulletins
      operationId: getSecurityAdvisoryBulletins
      description: Returns Security Advisory bulletin data for the bulletins in the security-advisories API.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/advisoryId_param'
        - $ref: '#/components/parameters/securityAdvisoryInstanceId_param'
        - $ref: '#/components/parameters/securityImpactRating_param'
        - $ref: '#/components/parameters/bulletinTitle_param'
        - $ref: '#/components/parameters/cveId_param'
        - $ref: '#/components/parameters/bulletinFirstPublished_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/SecurityAdvisoryBulletinsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/software-eol:
    get:
      summary: List Software EOL
      operationId: getSoftwareEOL
      description: Returns the Software End of Life details of the software running on the assets in a CX Cloud account.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/neInstanceId_param'
        - $ref: '#/components/parameters/managedNeInstanceId_param'
        - $ref: '#/components/parameters/hostname_param'
        - $ref: '#/components/parameters/swType_param'
        - $ref: '#/components/parameters/swVersion_param'
        - $ref: '#/components/parameters/currentSwEolMilestone_param'
        - $ref: '#/components/parameters/nextSwEolMilestone_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/SoftwareEolResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]
  /product-alerts/software-eol-bulletins:
    get:
      summary: List Software EOL Bulletins
      operationId: getSoftwareEOLBulletins
      description: Returns End of Life bulletin data for the bulletins in the software-eol API.
      tags: [productAlert]
      parameters:
        - $ref: '#/components/parameters/customerId_param'
        - $ref: '#/components/parameters/swEolInstanceId_param'
        - $ref: '#/components/parameters/bulletinNumber_param'
        - $ref: '#/components/parameters/bulletinTitle_param'
        - $ref: '#/components/parameters/eoLifeAnnouncementDate_param'
        - $ref: '#/components/parameters/eoSaleDate_param'
        - $ref: '#/components/parameters/eoSwMaintenanceReleasesDate_param'
        - $ref: '#/components/parameters/lastDateOfSupport_param'
        - $ref: '#/components/parameters/eoVulnerabilitySecuritySupport_param'
        - $ref: '#/components/parameters/format_param'
        - $ref: '#/components/parameters/fields_param'
        - $ref: '#/components/parameters/page_param'
        - $ref: '#/components/parameters/rows_param'
        - $ref: '#/components/parameters/sort_param'
      responses:
        '200': { $ref: '#/components/responses/SoftwareEolBulletinsResponse' }
        '400': { $ref: '#/components/responses/BadRequestResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedResponse' }
        '403': { $ref: '#/components/responses/ForbiddenResponse' }
        '404': { $ref: '#/components/responses/NotFoundResponse' }
        '500': { $ref: '#/components/responses/InternalServerErrorResponse' }
      security:
        - Oauth2: [apis:read]

components:
  parameters:
    format_param:
      name: format
      in: query
      description: Output format of the API response
      schema:
        type: string
        default: JSON
        enum:
          - 'JSON'
          - 'CSV'
          - 'TSV'
    fields_param:
      name: fields
      in: query
      description: Restricts API response to the specific fields.
      schema:
        type: string
        example: 'field1,field2'
    page_param:
      name: page
      in: query
      description: The page to return in a paginated API response.
      schema:
        type: integer
        minimum: 1
        default: 1
    rows_param:
      name: rows
      in: query
      description: The size of the page in the API response.
      schema:
        type: integer
        default: 20
    sort_param:
      name: sort
      in: query
      description: 'The sort order (ASC or DESC) for a field in the API response.  Can be specified multiple times for multi-field sorting.  If order is not specified for a field, it defaults to ASC.  Example with multi-field sorting: sort=field&sort=field2:DESC'
      schema:
        type: array
        items:
          type: string
      explode: true
    advisoryId_param:
      name: advisoryId
      in: query
      description: Published identifier of a security advisory
      schema:
        type: string
        example: 'cisco-sa-ise-unauth-rce-ZAd2GnJ6'
    bulletinFirstPublished_param:
      name: bulletinFirstPublished
      in: query
      description: Date when the bulletin was first published to Cisco.com
      schema:
        type: string
        example: '2024-11-11'
    bulletinNumber_param:
      name: bulletinNumber
      in: query
      description: Unique identifier for a bulletin on Cisco.com
      schema:
        type: string
        example: 'EOL15177'
    bulletinProductId_param:
      name: bulletinProductId
      in: query
      description: Cisco Product ID on a published EOL bulletin
      schema:
        type: string
        example: 'WS-C6509-E'
    bulletinTitle_param:
      name: bulletinTitle
      in: query
      description: Cisco.com Title/Headline for the bulletin
      schema:
        type: string
        example: 'DNA Center Second Generation Appliance'
    contractEndDate_param:
      name: contractEndDate
      in: query
      description: Limits the results to contracts that end on or before this date
      schema:
        type: string
        example: '2024-03-30'
    contractInstanceNumber_param:
      name: contractInstanceNumber_param
      in: query
      description: The Instance Number in Cisco Commerce for an asset 
      schema:
        type: string
        example: '987654321'
    contractNumber_param:
      name: contractNumber
      in: query
      description: A Cisco service contract number
      schema:
        type: string
        example: '123456789'
    contractStartDate_param:
      name: contractStartDate
      in: query
      description: Limits the results to contracts that start on or after this date
      schema:
        type: string
        example: '2021-03-31'
    contractStatus_param:
      name: contractStatus
      in: query
      description: Status of the service contract
      schema:
        type: string
        example: 'ACTIVE'
        enum:
          - 'ACTIVE'
          - 'OVERDUE'
          - 'SIGNED'
    coverageEndDate_param:
      name: coverageEndDate
      in: query
      description: Limits the results to assets where coverage ends on or before this date
      schema:
        type: string
        example: '2026-12-31'
    coverageStartDate_param:
      name: coverageStartDate
      in: query
      description: Limits the results to assets where coverage starts on or after this date
      schema:
        type: string
        example: '2025-03-31'
    coverageStatus_param:
      name: coverageStatus
      in: query
      description: The contract coverage status for a specific piece of hardware
      schema:
        type: string
        example: 'ACTIVE'
        enum:
          - 'ACTIVE'
    currentHwEolMilestone_param:
      name: currentHwEolMilestone
      in: query
      description: Latest hardware end-of-life milestone that has passed for the product
      schema:
        type: string
        example: 'LAST_SUPPORT_DATE'
    currentSwEolMilestone_param:
      name: currentSwEolMilestone
      in: query
      description: Latest software end-of-life milestone that has passed for the product
      schema:
        type: string
